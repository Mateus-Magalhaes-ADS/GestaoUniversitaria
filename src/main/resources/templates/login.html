<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Gestão Universitária</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h4>Sistema de Gestão Universitária</h4>
                </div>
                <div class="card-body p-4">
                    
                    <!-- Alerta de Sucesso no Registo -->
                    <div th:if="${param.sucesso}" class="alert alert-success" role="alert">
                        Conta criada com sucesso! Faça o login para continuar.
                    </div>

                    <!-- Alertas de Erro e Logout -->
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Usuário ou senha inválidos.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-info" role="alert">
                        Você saiu do sistema.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <!-- Proteção CSRF -->
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="username" class="form-label">e-mail</label>
                            <input type="email" class="form-control" id="username" name="username" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Senha</label>
                            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Entrar</button>
                        </div>
                    </form>

                    <hr class="my-4">

                    <!-- Links de navegação adicionais -->
                    <div class="text-center">
                        <p class="mb-2">É um novo aluno?</p>
                        <a th:href="@{/matricula}" class="btn btn-outline-success w-100 mb-2">
                            Solicitar Matrícula
                        </a>
                        <a th:href="@{/registrar}" class="btn btn-link text-decoration-none small">
                            Criar conta de acesso
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
