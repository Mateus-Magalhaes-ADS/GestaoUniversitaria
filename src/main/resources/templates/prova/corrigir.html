<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrigir Resposta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .questao-bloco { border: 1px solid #dee2e6; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <span class="navbar-brand">Portal do Docente</span>
            <a th:href="@{/prova/{id}/corrigir(id=${prova.id})}" class="btn btn-outline-light btn-sm">Voltar à lista</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 th:text="${prova.titulo}">Prova</h2>
        <p class="text-muted">
            Aluno: <span th:text="${resposta.alunoNome}"></span> (<span th:text="${resposta.alunoEmail}"></span>)
        </p>

        <form th:action="@{/prova/{id}/corrigir/{respostaId}(id=${prova.id},respostaId=${resposta.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="questao-bloco" th:each="questao : ${prova.questoes}"
                 th:with="respostaQuestao=${respostasPorQuestao.get(questao.id)}">
                <p class="fw-bold" th:text="${questao.enunciado}"></p>
                <p class="text-muted small" th:text="'Valor: ' + ${questao.valor} + ' pontos'"></p>

                <div th:if="${questao.tipo.name() == 'OBJETIVA'}" class="mb-2">
                    <p>Resposta do aluno:
                        <strong th:if="${respostaQuestao != null and respostaQuestao.alternativaEscolhida != null}"
                                th:text="${questao.alternativas.get(respostaQuestao.alternativaEscolhida)}"></strong>
                        <em th:if="${respostaQuestao == null or respostaQuestao.alternativaEscolhida == null}">Não respondida</em>
                    </p>
                    <p class="text-muted small">Alternativa correta: <span th:text="${questao.alternativas.get(questao.alternativaCorreta)}"></span></p>
                </div>
                <div th:if="${questao.tipo.name() == 'DISSERTATIVA'}" class="mb-2">
                    <p>Resposta do aluno:</p>
                    <blockquote class="border-start ps-3" th:text="${respostaQuestao != null ? respostaQuestao.textoResposta : ''}">
                    </blockquote>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Nota atribuída</label>
                        <input type="number" class="form-control" th:name="'nota_' + ${questao.id}" step="0.1" min="0" th:max="${questao.valor}"
                               th:value="${respostaQuestao != null ? respostaQuestao.nota : null}" required>
                    </div>
                    <div class="col-md-8">
                        <label class="form-label">Comentário (opcional)</label>
                        <input type="text" class="form-control" th:name="'comentario_' + ${questao.id}"
                               th:value="${respostaQuestao != null ? respostaQuestao.comentarioProfessor : ''}">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Salvar correção</button>
        </form>
    </div>
</body>
</html>
