<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrigir Prova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <span class="navbar-brand">Portal do Docente</span>
            <a th:href="@{/prova/professor}" class="btn btn-outline-light btn-sm">Voltar às minhas provas</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 th:text="${prova.titulo}">Prova</h2>
        <p class="text-muted" th:text="${prova.disciplina}"></p>

        <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>

        <p th:if="${#lists.isEmpty(respostas)}" class="text-muted">Nenhum aluno respondeu esta prova ainda.</p>

        <div th:unless="${#lists.isEmpty(respostas)}" class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>E-mail</th>
                        <th>Status</th>
                        <th>Nota</th>
                        <th>Ação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="resposta : ${respostas}">
                        <td th:text="${resposta.alunoNome}"></td>
                        <td th:text="${resposta.alunoEmail}"></td>
                        <td>
                            <span th:if="${resposta.corrigida}" class="badge bg-success">Corrigida</span>
                            <span th:unless="${resposta.corrigida}" class="badge bg-warning text-dark">Pendente</span>
                        </td>
                        <td th:text="${resposta.notaFinal}"></td>
                        <td>
                            <a th:href="@{/prova/{id}/corrigir/{respostaId}(id=${prova.id},respostaId=${resposta.id})}" class="btn btn-sm btn-outline-primary">
                                <span th:text="${resposta.corrigida} ? 'Revisar' : 'Corrigir'"></span>
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
