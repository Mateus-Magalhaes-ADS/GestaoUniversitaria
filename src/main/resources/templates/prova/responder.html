<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${prova.titulo}">Responder Prova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .questao-bloco { border: 1px solid #dee2e6; border-radius: 10px; padding: 1rem; margin-bottom: 1rem; }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Portal do Aluno</span>
            <a th:href="@{/prova/disponiveis}" class="btn btn-outline-light btn-sm">Voltar à lista</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 th:text="${prova.titulo}">Prova</h2>
        <p class="text-muted" th:text="${prova.disciplina}"></p>
        <div th:if="${mensagemErro}" class="alert alert-danger" role="alert" th:text="${mensagemErro}"></div>
        <p class="text-muted">Responda às seis questões de múltipla escolha e à questão dissertativa.</p>

        <form th:action="@{/prova/{id}/responder(id=${prova.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="questao-bloco" th:each="questao, iteradorQuestao : ${prova.questoes}">
                <p class="fw-bold">
                    <span th:text="'Questão ' + ${iteradorQuestao.count}"></span>
                    <span th:text="${questao.enunciado}"></span>
                </p>
                <p class="text-muted small" th:text="'Valor: ' + ${questao.valor} + ' pontos'"></p>

                <div th:if="${questao.tipo.name() == 'OBJETIVA'}">
                    <div class="form-check" th:each="alternativa, iterador : ${questao.alternativas}">
                        <input class="form-check-input" type="radio"
                               th:name="'alternativa_' + ${questao.id}" th:value="${iterador.index}"
                               th:id="'alt_' + ${questao.id} + '_' + ${iterador.index}" required>
                        <label class="form-check-label" th:for="'alt_' + ${questao.id} + '_' + ${iterador.index}" th:text="${alternativa}"></label>
                    </div>
                </div>
                <div th:if="${questao.tipo.name() == 'DISSERTATIVA'}">
                    <textarea class="form-control" th:name="'texto_' + ${questao.id}" rows="4" required></textarea>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Enviar respostas</button>
        </form>
    </div>
</body>
</html>
