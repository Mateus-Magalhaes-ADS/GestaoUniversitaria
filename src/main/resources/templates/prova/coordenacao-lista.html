<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provas para Publicação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Gestão Acadêmica (Coordenação)</span>
            <a th:href="@{/coordenador/dashboard}" class="btn btn-outline-light btn-sm">Voltar ao painel</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Provas corrigidas aguardando publicação</h2>

        <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
        <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

        <p th:if="${#lists.isEmpty(provas)}" class="text-muted">Nenhuma prova aguardando validação no momento.</p>

        <div th:unless="${#lists.isEmpty(provas)}" class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Disciplina</th>
                        <th>Professor</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prova : ${provas}">
                        <td th:text="${prova.titulo}"></td>
                        <td th:text="${prova.disciplina}"></td>
                        <td th:text="${prova.professorNome}"></td>
                        <td><span class="badge bg-secondary" th:text="${prova.status}"></span></td>
                        <td class="text-nowrap">
                            <a th:href="@{/prova/coordenacao/{id}(id=${prova.id})}" class="btn btn-sm btn-outline-primary">Revisar</a>
                            <form th:if="${prova.status.name() == 'CORRIGIDA'}" th:action="@{/prova/{id}/publicar(id=${prova.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-success">Publicar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
