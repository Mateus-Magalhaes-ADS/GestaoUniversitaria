<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Provas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-success">
        <div class="container">
            <span class="navbar-brand">Portal do Docente</span>
            <a th:href="@{/professor/dashboard}" class="btn btn-outline-light btn-sm">Voltar ao painel</a>
        </div>
    </nav>

    <div class="container my-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="mb-0">Minhas Provas</h2>
            <a th:href="@{/prova/nova}" class="btn btn-primary">Nova prova</a>
        </div>

        <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>
        <div th:if="${mensagemErro}" class="alert alert-danger" th:text="${mensagemErro}"></div>

        <p th:if="${#lists.isEmpty(provas)}" class="text-muted">Nenhuma prova criada ainda.</p>

        <div th:unless="${#lists.isEmpty(provas)}" class="table-responsive">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Disciplina</th>
                        <th>Questões</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="prova : ${provas}">
                        <td th:text="${prova.titulo}"></td>
                        <td th:text="${prova.disciplina}"></td>
                        <td th:text="${#lists.size(prova.questoes)}"></td>
                        <td><span class="badge bg-secondary" th:text="${prova.status}"></span></td>
                        <td class="text-nowrap">
                            <form th:if="${prova.status.name() == 'RASCUNHO'}" th:action="@{/prova/{id}/abrir(id=${prova.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-success">Abrir</button>
                            </form>
                            <form th:if="${prova.status.name() == 'ABERTA'}" th:action="@{/prova/{id}/encerrar(id=${prova.id})}" method="post" class="d-inline">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm btn-outline-warning">Encerrar</button>
                            </form>
                            <a th:if="${prova.status.name() != 'RASCUNHO'}" th:href="@{/prova/{id}/corrigir(id=${prova.id})}" class="btn btn-sm btn-outline-primary">Corrigir respostas</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
