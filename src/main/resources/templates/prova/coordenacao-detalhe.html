<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Prova</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand">Gestão Acadêmica (Coordenação)</span>
            <a th:href="@{/prova/coordenacao}" class="btn btn-outline-light btn-sm">Voltar à lista</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 th:text="${prova.titulo}">Prova</h2>
        <p class="text-muted" th:text="${prova.disciplina} + ' · ' + ${prova.professorNome}"></p>
        <p>Status atual: <span class="badge bg-secondary" th:text="${prova.status}"></span></p>

        <div th:unless="${#lists.isEmpty(respostas)}" class="table-responsive mb-4">
            <table class="table table-striped align-middle">
                <thead>
                    <tr>
                        <th>Aluno</th>
                        <th>E-mail</th>
                        <th>Nota final</th>
                        <th>Situação</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="resposta : ${respostas}">
                        <td th:text="${resposta.alunoNome}"></td>
                        <td th:text="${resposta.alunoEmail}"></td>
                        <td th:text="${resposta.notaFinal}"></td>
                        <td>
                            <span th:if="${resposta.corrigida}" class="badge bg-success">Corrigida</span>
                            <span th:unless="${resposta.corrigida}" class="badge bg-warning text-dark">Pendente</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <form th:if="${prova.status.name() == 'CORRIGIDA'}" th:action="@{/prova/{id}/publicar(id=${prova.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button type="submit" class="btn btn-success">Validar e publicar notas</button>
        </form>
    </div>
</body>
</html>
