<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provas Disponíveis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <span class="navbar-brand">Portal do Aluno</span>
            <a th:href="@{/aluno/dashboard}" class="btn btn-outline-light btn-sm">Voltar ao painel</a>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="mb-4">Provas disponíveis para responder</h2>

        <div th:if="${mensagemSucesso}" class="alert alert-success" th:text="${mensagemSucesso}"></div>

        <p th:if="${#lists.isEmpty(provas)}" class="text-muted">Nenhuma prova disponível no momento.</p>

        <div class="row g-3">
            <div class="col-md-6" th:each="prova : ${provas}">
                <div class="card h-100 shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${prova.titulo}"></h5>
                        <p class="card-text text-muted" th:text="${prova.disciplina}"></p>
                        <p class="card-text small">Professor: <span th:text="${prova.professorNome}"></span></p>
                        <a th:href="@{/prova/{id}/responder(id=${prova.id})}" class="btn btn-primary">Responder</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
