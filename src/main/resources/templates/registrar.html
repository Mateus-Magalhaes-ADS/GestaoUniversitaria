<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Criar Conta - Gestão Universitária</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow p-4" style="width: 100%; max-width: 450px;">
        <h3 class="text-center mb-4">Criar Conta</h3>

        <div th:if="${param.erro != null and param.erro[0] == 'email'}" class="alert alert-danger" role="alert">
            Este e-mail já possui uma conta cadastrada.
        </div>
        <div th:if="${param.erro != null and param.erro[0] == 'convite'}" class="alert alert-danger" role="alert">
            O código de convite está ausente ou inválido para o nível escolhido.
        </div>
        <div th:if="${param.erro != null and param.erro[0] == 'perfil'}" class="alert alert-danger" role="alert">
            Selecione um nível de acesso válido.
        </div>

        <form th:action="@{/registrar}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            
            <div class="mb-3">
                <label class="form-label">Nome Completo</label>
                <input type="text" name="nome" class="form-control" th:value="${nomeInformado}" required />
            </div>
            
            <div class="mb-3">
                <label class="form-label">e-mail</label>
                <input type="email" name="email" class="form-control" th:value="${emailInformado}" required />
            </div>
            
            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" required />
            </div>
            
            <div class="mb-3">
                <label for="perfil" class="form-label">Nível de acesso</label>
                <select id="perfil" name="perfil" class="form-select" required>
                    <option value="ALUNO" th:selected="${perfilInformado == null or perfilInformado == 'ALUNO'}">Aluno</option>
                    <option value="PROFESSOR" th:selected="${perfilInformado == 'PROFESSOR'}">Professor</option>
                    <option value="COORDENADOR" th:selected="${perfilInformado == 'COORDENADOR'}">Coordenador</option>
                </select>
            </div>
            
            <div id="campo-convite" class="mb-3" hidden>
                <label for="codigoConvite" class="form-label">Código de convite</label>
                <input type="password" id="codigoConvite" name="codigoConvite" class="form-control"
                       autocomplete="off" aria-describedby="ajuda-convite" />
                <div id="ajuda-convite" class="form-text">Necessário para criar contas de professor ou coordenador.</div>
            </div>
            
            <button type="submit" class="btn btn-success w-100">Registar</button>
        </form>

        <div class="text-center mt-3">
            <a th:href="@{/login}">Voltar ao Login</a>
        </div>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const perfilSelect = document.getElementById('perfil');
        const campoConvite = document.getElementById('campo-convite');
        const codigoConvite = document.getElementById('codigoConvite');

        function atualizarCampoConvite() {
            // Garante comparação case-insensitive e sem espaços
            const valorPerfil = (perfilSelect.value || '').trim().toUpperCase();
            const exigeConvite = (valorPerfil !== 'ALUNO');

            campoConvite.hidden = !exigeConvite;
            codigoConvite.required = exigeConvite;
            codigoConvite.disabled = !exigeConvite;

            // Se for ALUNO, limpa o valor do campo para evitar envio acidental
            if (!exigeConvite) {
                codigoConvite.value = '';
            }
        }

        perfilSelect.addEventListener('change', atualizarCampoConvite);
        
        // Executa imediatamente no carregamento da página
        atualizarCampoConvite();
        });
    </script>






</body>
</html>
