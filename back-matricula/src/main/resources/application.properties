spring.application.name=uniconecta-api
server.port=8080

# ---------- Banco de dados (PostgreSQL) ----------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/uniconecta}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# As tabelas são criadas pelo Flyway (src/main/resources/db/migration).
# O Hibernate apenas valida se as entidades batem com o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.enabled=true

# ---------- Segurança ----------
# Chave usada para assinar o token JWT (mínimo de 32 caracteres).
uniconecta.jwt.secret=${JWT_SECRET:uniconecta-chave-secreta-de-demonstracao-2026-faculdade}
uniconecta.jwt.expiracao-minutos=480
uniconecta.cors.origens=http://localhost:5180,http://127.0.0.1:5180

# ---------- Pagamentos (gateway SIMULADO - trabalho acadêmico) ----------
# O Pix é confirmado automaticamente depois desta quantidade de segundos.
uniconecta.pagamento.pix-confirmacao-segundos=8
uniconecta.pagamento.pix-chave=financeiro@uniconecta.edu.br
uniconecta.pagamento.boleto-dias-vencimento=3
