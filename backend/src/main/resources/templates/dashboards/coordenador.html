<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel da Coordenação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/brand.css}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <span class="navbar-brand d-flex align-items-center gap-3">
                <a th:replace="~{fragments/brand :: logo}"></a>
                Gestão Acadêmica (Coordenação)
            </span>
            <form th:action="@{/logout}" method="post" class="d-flex">
                <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
            </form>
        </div>
    </nav>
    <div class="container my-5">
        <h2>Painel de Gestão - Coordenador (<span th:text="${usuario}"></span>)</h2>
        <p class="text-muted" th:text="${emailUsuario}"></p>
        <div th:if="${mensagemSucesso}" class="alert alert-success" role="alert" th:text="${mensagemSucesso}"></div>
        <div th:if="${mensagemErro}" class="alert alert-danger" role="alert" th:text="${mensagemErro}"></div>
        <div class="row mt-4 g-3">
            <div class="col-md-4"><div class="card p-3 shadow-sm"><h5>Grade Curricular</h5></div></div>
            <div class="col-md-4"><div class="card p-3 shadow-sm"><h5>Alocação de Professores</h5></div></div>
            <div class="col-md-4"><div class="card p-3 shadow-sm"><h5>Relatórios Acadêmicos</h5></div></div>
        </div>
        <div class="mt-4">
            <a th:href="@{/prova/coordenacao/nova}" class="btn btn-success me-2">Criar prova para os alunos</a>
            <a th:href="@{/prova/coordenacao}" class="btn btn-dark">Provas para publicar</a>
        </div>
        <div th:replace="~{dashboards/fragmentos/matriculas :: lista('Solicitações de matrícula', ${matriculas})}"></div>
    </div>
</body>
</html>
