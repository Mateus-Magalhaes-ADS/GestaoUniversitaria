server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/uniconecta}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5500,http://127.0.0.1:5500}
app.oauth.redirect-uris=${OAUTH_REDIRECT_URI:http://localhost:5500/callback.html,http://127.0.0.1:5500/callback.html,http://localhost:5500/front/callback.html,http://127.0.0.1:5500/front/callback.html}
app.oauth.issuer=${OAUTH_ISSUER:http://localhost:8080}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

